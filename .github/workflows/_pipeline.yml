# Reusable pipeline: lint → migrate → seed → deploy, with automatic DB rollback on failure.
name: Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub + Vercel environment: preview | production"
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Every migration has a down file
        run: pnpm db:check-down

  migrate:
    name: Migrate & seed (${{ inputs.environment }})
    needs: lint
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      applied: ${{ steps.migrate.outputs.applied }}
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run migrations
        id: migrate
        run: pnpm db:migrate
      - name: Seed
        run: pnpm db:seed

  deploy:
    name: Deploy to Vercel (${{ inputs.environment }})
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n🚀 **Preview deployed:** ${process.env.DEPLOY_URL}\n\nCommit: ${context.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  rollback:
    name: Roll back DB (${{ inputs.environment }})
    needs: [migrate, deploy]
    # Runs only if something failed AND this run actually applied migrations.
    if: ${{ failure() && needs.migrate.outputs.applied != '' && needs.migrate.outputs.applied != '0' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Roll back ${{ needs.migrate.outputs.applied }} migration(s)
        run: pnpm db:rollback --steps ${{ needs.migrate.outputs.applied }}
