name: Preview

on:
  pull_request:
    branches: [main]

# All PRs share the single preview-db, so runs are serialized (never cancelled mid-migration).
concurrency:
  group: preview-db
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline.yml
    with:
      environment: preview
    secrets: inherit
