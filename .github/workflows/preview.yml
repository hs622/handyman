# Preview: every PR to main is linted and deployed to a Vercel preview URL.
name: Preview

on:
  pull_request:
    branches: [main]

# One run per PR; a new push cancels the outdated preview build.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  pipeline:
    name: Preview
    uses: ./.github/workflows/_pipeline.yml
    with:
      environment: preview
    secrets: inherit
