# Production: every push to static-site is linted and deployed to the Vercel production domain.
# The static site ships from its own branch (it is not merged into main); "Run workflow" redeploys by hand.
name: Production

on:
  push:
    branches: [static-site]
  workflow_dispatch:

# One production deploy at a time; a queued run waits for the current one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  pipeline:
    name: Production
    uses: ./.github/workflows/_pipeline.yml
    with:
      environment: production
    secrets: inherit
