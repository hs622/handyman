# Production: every push to main is linted and deployed to the Vercel production domain.
name: Production

on:
  push:
    branches: [main]

# One production deploy at a time; a queued run waits for the current one.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  pipeline:
    name: Production
    uses: ./.github/workflows/_pipeline.yml
    with:
      environment: production
    secrets: inherit
