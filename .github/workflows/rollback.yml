# Manual rollback: point the Vercel production domain back at the previous deployment.
# Run from Actions → Rollback → Run workflow.
name: Rollback

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Instantly re-aliases production to the previous deployment (no rebuild).
      - name: Roll back Vercel production deployment to previous
        run: vercel rollback --yes --token=${{ secrets.VERCEL_TOKEN }}
